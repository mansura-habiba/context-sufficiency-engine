name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline benchmark
        run: python -m cse benchmark examples/eval_cases.json
      - name: Demo compile
        run: python -m cse compile examples/incident.json
      - name: CSE ThreatBench pilot tests
        run: python research/cse-threatbench/test_pilot.py
      - name: Deterministic ThreatBench report
        run: python research/cse-threatbench/pilot.py --output /tmp/cse-threatbench-pilot.json
