[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-sufficiency-engine"
version = "0.1.0"
description = "A secure, dependency-aware context compiler with pluggable System One decision scoring"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Context Sufficiency Engine Contributors"}]
license = {text = "Apache-2.0"}
keywords = ["context-engineering", "decision-models", "llm", "security", "inference"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.scripts]
cse = "cse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
